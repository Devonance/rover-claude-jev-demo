<text x="40" y="1092" fill="#aab4bf" font-size="12">Measured on the ROS 2 run: 18 Claude calls, 13 of them consulted jev — 13 consultations, 33 questions, 222–361 ms each; the rover itself made 96 jev requests while driving.</text>
<text x="40" y="1112" fill="#aab4bf" font-size="12">A consultation costs Claude nothing extra: jev answers in the time a token takes. The dashed loop is the onboard ledger fed back into the next plan.</text>
