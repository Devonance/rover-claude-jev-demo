<text x="40" y="1308" fill="#aab4bf" font-size="12">Measured on the recorded run: 760 jev calls, about 2,900 typed questions, 37 whole-rig sweeps, 27 vetoes, 622 health verdicts (93 non-nominal), zero node errors. Rows 1–13 are services (200–500 ms); row 14 is an MCP tool call inside a Claude action.</text>
<text x="40" y="1326" fill="#aab4bf" font-size="12">Cost of all of it: $0.03 of jev against $1.10 for 16 Claude calls. Latency is flat against question count, which is why the whole rig can be asked at once.</text>
<text x="40" y="1344" fill="#aab4bf" font-size="12">What jev is never asked: what to do next. That is a rule, and every rule cites the flight rule it enforces.</text>
</svg>