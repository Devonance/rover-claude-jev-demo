<path d="M960,663 L1000,663" stroke="#3a4450" stroke-width="1.2"/>
<path d="M1460,663 L1500,663" stroke="#3a4450" stroke-width="1.2"/>
<rect x="40" y="710" width="440" height="72" rx="8" fill="#0f1317" stroke="#3a4450" stroke-width="1.2"/>
<text x="52" y="732" fill="#c9d1d9" font-size="13" font-weight="600">8. science stop (AEGIS-style)</text>
<text x="52" y="748" fill="#7f8b98" font-size="11">candidates in view + Claude&#x27;s Navcam read + the criteria</text>
<rect x="520" y="710" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="732" fill="#d9a441" font-size="12">match (Score 0–3) · instrument (Choice ×5) · arm safe (Noul)</text>
<rect x="1000" y="710" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="734" fill="#5aa7e6" font-size="12">each stop, 1 request</text>
<rect x="1500" y="710" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="731" fill="#4fd18b" font-size="11.5">selection rule; arm rule: 0.6 floor [FR-09]</text>
<path d="M480,743 L520,743" stroke="#3a4450" stroke-width="1.2"/>
<path d="M960,743 L1000,743" stroke="#3a4450" stroke-width="1.2"/>
<path d="M1460,743 L1500,743" stroke="#3a4450" stroke-width="1.2"/>
<rect x="40" y="790" width="440" height="72" rx="8" fill="#0f1317" stroke="#3a4450" stroke-width="1.2"/>
<text x="52" y="812" fill="#c9d1d9" font-size="13" font-weight="600">9. arm placement (each contact-science activity)</text>
<text x="52" y="828" fill="#7f8b98" font-size="11">candidate spots from the rock geometry, plus the MEASURED arm</text>
<text x="52" y="841" fill="#7f8b98" font-size="11">envelope: reach 2.05 m, turret a 0.84 m disc, instrument on its</text>
<text x="52" y="854" fill="#7f8b98" font-size="11">rim</text>
<rect x="520" y="790" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="812" fill="#d9a441" font-size="12">placement quality (Score 0–3) · collision risk (Noul), per</text>
<text x="532" y="826" fill="#c9b98a" font-size="12">spot</text>
<rect x="1000" y="790" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="814" fill="#5aa7e6" font-size="12">each arm activity, 1 request</text>
<rect x="1500" y="790" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="811" fill="#4fd18b" font-size="11.5">code checks its own collision model FIRST and refuses outright</text>
<text x="1512" y="824" fill="#9fd9b6" font-size="11.5">if any link but the instrument face enters a measured rock; jev</text>
<text x="1512" y="837" fill="#9fd9b6" font-size="11.5">then scores what is left [FR-09]</text>
<path d="M480,823 L520,823" stroke="#3a4450" stroke-width="1.2"/>
<path d="M960,823 L1000,823" stroke="#3a4450" stroke-width="1.2"/>
<path d="M1460,823 L1500,823" stroke="#3a4450" stroke-width="1.2"/>
<rect x="40" y="870" width="440" height="72" rx="8" fill="#0f1317" stroke="#3a4450" stroke-width="1.2"/>
<text x="52" y="892" fill="#c9d1d9" font-size="13" font-weight="600">10. pre-contact check (hover, 30 cm over the spot)</text>
<text x="52" y="908" fill="#7f8b98" font-size="11">workspace in words: placement-solution error, surface tilt, and</text>
<text x="52" y="921" fill="#7f8b98" font-size="11">the MEASURED clearance from the arm collision model</text>
<rect x="520" y="870" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="892" fill="#d9a441" font-size="12">safe to contact · good data (Noul) · next (Choice ×3)</text>
<rect x="1000" y="870" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="894" fill="#5aa7e6" font-size="12">each placement, 1 request</text>
<rect x="1500" y="870" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="891" fill="#4fd18b" font-size="11.5">safe ≥ 0.5 → lower to contact and measure; else the next spot</text>
<text x="1512" y="904" fill="#9fd9b6" font-size="11.5">once, or stow [FR-09]</text>
