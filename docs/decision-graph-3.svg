<text x="52" y="1148" fill="#7f8b98" font-size="11">requester&#x27;s text, the target, the draft activities</text>
<rect x="520" y="1110" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="1132" fill="#d9a441" font-size="12">serves · prerequisites · risk (Noul each)</text>
<rect x="1000" y="1110" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="1134" fill="#5aa7e6" font-size="12">each objective</text>
<rect x="1500" y="1110" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="1131" fill="#4fd18b" font-size="11.5">commit survivors to the swimlane; drive; execute; Claude reports</text>
<text x="1512" y="1144" fill="#9fd9b6" font-size="11.5">[FR-12]</text>
<path d="M480,1143 L520,1143" stroke="#3a4450" stroke-width="1.2"/>
<path d="M960,1143 L1000,1143" stroke="#3a4450" stroke-width="1.2"/>
<path d="M1460,1143 L1500,1143" stroke="#3a4450" stroke-width="1.2"/>
<rect x="40" y="1190" width="440" height="72" rx="8" fill="#0f1317" stroke="#b48cff" stroke-width="1.2"/>
<text x="52" y="1212" fill="#c9d1d9" font-size="13" font-weight="600">14. inside Claude&#x27;s reasoning</text>
<text x="52" y="1228" fill="#7f8b98" font-size="11">whatever the planner assembles: draft criteria, candidate order,</text>
<text x="52" y="1241" fill="#7f8b98" font-size="11">evidence</text>
<rect x="520" y="1190" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="1212" fill="#d9a441" font-size="12">score · order check · tie-break · self-audit (as asked)</text>
<rect x="1000" y="1190" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="1214" fill="#5aa7e6" font-size="12">~1 per Claude task, MCP tool</text>
<rect x="1500" y="1190" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="1211" fill="#4fd18b" font-size="11.5">evidence Claude weighs and cites; captured under its card;</text>
<text x="1512" y="1224" fill="#9fd9b6" font-size="11.5">counted in the HUD</text>
