<path d="M960,983 L1000,983" stroke="#3a4450" stroke-width="1.2"/>
<path d="M1460,983 L1500,983" stroke="#3a4450" stroke-width="1.2"/>
<rect x="40" y="1030" width="440" height="72" rx="8" fill="#0f1317" stroke="#3a4450" stroke-width="1.2"/>
<text x="52" y="1052" fill="#c9d1d9" font-size="13" font-weight="600">12. relay pass</text>
<text x="52" y="1068" fill="#7f8b98" font-size="11">data products: instrument, target, content, size; the hypotheses</text>
<rect x="520" y="1030" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="1052" fill="#d9a441" font-size="12">value if sent now (Score 0–3) per product</text>
<rect x="1000" y="1030" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="1054" fill="#5aa7e6" font-size="12">each pass, 1 request</text>
<rect x="1500" y="1030" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="1051" fill="#4fd18b" font-size="11.5">order by score, fill the pass minus a 40 Mb engineering reserve</text>
<text x="1512" y="1064" fill="#9fd9b6" font-size="11.5">[FR-02]</text>
