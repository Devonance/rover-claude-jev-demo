<text x="52" y="988" fill="#7f8b98" font-size="11">target, evidence in hand, campaign goal</text>
<rect x="520" y="950" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="972" fill="#d9a441" font-size="12">defensible · coherent (Noul) · missing (Choice ×5)</text>
<rect x="1000" y="950" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="974" fill="#5aa7e6" font-size="12">before any core</text>
<rect x="1500" y="950" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="971" fill="#4fd18b" font-size="11.5">core withheld with the missing step named, else committed</text>
<text x="1512" y="984" fill="#9fd9b6" font-size="11.5">[FR-10]</text>
