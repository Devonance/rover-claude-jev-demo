<path d="M960,183 L1000,183" stroke="#3a4450" stroke-width="1.2"/>
<path d="M1460,183 L1500,183" stroke="#3a4450" stroke-width="1.2"/>
<rect x="40" y="230" width="440" height="72" rx="8" fill="#0f1317" stroke="#3a4450" stroke-width="1.2"/>
<text x="52" y="252" fill="#c9d1d9" font-size="13" font-weight="600">2. Navcam pair (planning horizon)</text>
<text x="52" y="268" fill="#7f8b98" font-size="11">features: appearance, size, position, stereo note</text>
<rect x="520" y="230" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="252" fill="#d9a441" font-size="12">type (Choice ×6) · wheel hazard · sinkage · science (Noul)</text>
<rect x="1000" y="230" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="254" fill="#5aa7e6" font-size="12">every 6 m · 1 request</text>
<rect x="1500" y="230" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="251" fill="#4fd18b" font-size="11.5">perception map · 6 m keep-out · opportunistic science [FR-04/05]</text>
<path d="M480,263 L520,263" stroke="#3a4450" stroke-width="1.2"/>
<path d="M960,263 L1000,263" stroke="#3a4450" stroke-width="1.2"/>
<path d="M1460,263 L1500,263" stroke="#3a4450" stroke-width="1.2"/>
<rect x="40" y="310" width="440" height="72" rx="8" fill="#0f1317" stroke="#3a4450" stroke-width="1.2"/>
<text x="52" y="332" fill="#c9d1d9" font-size="13" font-weight="600">3. ground ahead</text>
<text x="52" y="348" fill="#7f8b98" font-size="11">corridor description: pavement, rocks, bright patches</text>
<rect x="520" y="310" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="332" fill="#d9a441" font-size="12">class (Choice ×4: bedrock · cobble · regolith · sand)</text>
<rect x="1000" y="310" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="334" fill="#5aa7e6" font-size="12">with the Navcam frame</text>
<rect x="1500" y="310" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="331" fill="#4fd18b" font-size="11.5">predicted slip 5/12/20/45 % → energy &amp; time per metre [FR-14]</text>
<path d="M480,343 L520,343" stroke="#3a4450" stroke-width="1.2"/>
<path d="M960,343 L1000,343" stroke="#3a4450" stroke-width="1.2"/>
<path d="M1460,343 L1500,343" stroke="#3a4450" stroke-width="1.2"/>
<rect x="40" y="390" width="440" height="72" rx="8" fill="#0f1317" stroke="#3a4450" stroke-width="1.2"/>
<text x="52" y="412" fill="#c9d1d9" font-size="13" font-weight="600">4. Navcam frame quality</text>
<text x="52" y="428" fill="#7f8b98" font-size="11">features counted, shadowed fraction, sun, exposure</text>
<rect x="520" y="390" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="412" fill="#d9a441" font-size="12">usable (Noul) · cause (Choice ×5)</text>
<rect x="1000" y="390" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="414" fill="#5aa7e6" font-size="12">with the Navcam frame</text>
<rect x="1500" y="390" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="411" fill="#4fd18b" font-size="11.5">P(usable) &lt; 0.5 → do not plan on it; mast pan, re-image [FR-08]</text>
