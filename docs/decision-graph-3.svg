<text x="40" y="1258" fill="#aab4bf" font-size="12">Measured on the recorded run: see docs/ros2/stats-final.txt — onboard jev requests by use, Claude actions with feedback and one cancel/re-issue, zero node errors. Rows 1–13 are services (200–500 ms); row 14 is an MCP tool call inside a Claude action.</text>
<text x="40" y="1280" fill="#aab4bf" font-size="12">What jev is never asked: what to do next. That is a rule, and every rule cites the flight rule it enforces.</text>
