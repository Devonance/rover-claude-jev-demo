<path d="M960,583 L1000,583" stroke="#3a4450" stroke-width="1.2"/>
<path d="M1460,583 L1500,583" stroke="#3a4450" stroke-width="1.2"/>
<rect x="40" y="630" width="440" height="72" rx="8" fill="#0f1317" stroke="#3a4450" stroke-width="1.2"/>
<text x="52" y="652" fill="#c9d1d9" font-size="13" font-weight="600">7. sequence review before uplink</text>
<text x="52" y="668" fill="#7f8b98" font-size="11">every planned activity: instrument, measures, purpose, order,</text>
<text x="52" y="681" fill="#7f8b98" font-size="11">arm</text>
<rect x="520" y="630" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="652" fill="#d9a441" font-size="12">serves · prerequisites · risk (Noul each)</text>
<rect x="1000" y="630" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="654" fill="#5aa7e6" font-size="12">once per sol, 1 request</text>
<rect x="1500" y="630" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="651" fill="#4fd18b" font-size="11.5">drop what fails, report to the planners; the rest is uplinked</text>
<text x="1512" y="664" fill="#9fd9b6" font-size="11.5">[FR-10]</text>
