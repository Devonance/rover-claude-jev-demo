<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1370" viewBox="0 0 2000 1370" font-family="ui-monospace, Consolas, Menlo, monospace">
<rect width="2000" height="1370" fill="#0b0d10"/>
<text x="40" y="60" fill="#c9d1d9" font-size="22" font-weight="700">JEZERO OPS · DECISION GRAPH III — WHERE A FAST CALIBRATED JUDGE IS USED ON THE ROVER</text>
<text x="40" y="86" fill="#7f8b98" font-size="13">fourteen uses of jev in the ROS 2 graph · every one is a closed question over words that code made from numbers · every answer is consumed by a rule that names its flight rule</text>
<text x="40" y="126" fill="#7f8b98" font-size="11" letter-spacing="2">STREAM (what code turns into words)</text>
<text x="520" y="126" fill="#d9a441" font-size="11" letter-spacing="2">JEV · TYPED QUESTIONS</text>
<text x="1000" y="126" fill="#5aa7e6" font-size="11" letter-spacing="2">CADENCE</text>
<text x="1500" y="126" fill="#4fd18b" font-size="11" letter-spacing="2">RULE THAT CONSUMES THE ANSWER</text>
<rect x="40" y="150" width="440" height="72" rx="8" fill="#0f1317" stroke="#3a4450" stroke-width="1.2"/>
<text x="52" y="172" fill="#c9d1d9" font-size="13" font-weight="600">1. whole-rig sweep (all four camera pairs)</text>
<text x="52" y="188" fill="#7f8b98" font-size="11">every pair images at once: Navcam out to 13 m, front + backup</text>
<text x="52" y="201" fill="#7f8b98" font-size="11">front + rear Hazcams 0.3–4 m beyond the wheel line; each feature</text>
<text x="52" y="214" fill="#7f8b98" font-size="11">carries the pair that measured it</text>
<rect x="520" y="150" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="172" fill="#d9a441" font-size="12">type (Choice ×6) · wheel hazard · sinkage · science (Noul),</text>
<text x="532" y="186" fill="#c9b98a" font-size="12">per feature, every pair in ONE request</text>
<rect x="1000" y="150" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="174" fill="#5aa7e6" font-size="12">before every wheel commit + mid-arc</text>
<rect x="1500" y="150" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="171" fill="#4fd18b" font-size="11.5">any one pair may veto → perception map / keep-out; ENav re-plans</text>
<text x="1512" y="184" fill="#9fd9b6" font-size="11.5">before a wheel turns · conf &lt; 0.55 → mast up, re-image</text>
<text x="1512" y="197" fill="#9fd9b6" font-size="11.5">[FR-04/06/08]</text>
