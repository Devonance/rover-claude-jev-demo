<text x="52" y="508" fill="#7f8b98" font-size="11">features behind the rover</text>
<rect x="520" y="470" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="492" fill="#d9a441" font-size="12">same, mirrored</text>
<rect x="1000" y="470" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="494" fill="#5aa7e6" font-size="12">before any reverse</text>
<rect x="1500" y="470" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="491" fill="#4fd18b" font-size="11.5">reverse only on imaged, judged ground [FR-07]</text>
<path d="M480,503 L520,503" stroke="#3a4450" stroke-width="1.2"/>
<path d="M960,503 L1000,503" stroke="#3a4450" stroke-width="1.2"/>
<path d="M1460,503 L1500,503" stroke="#3a4450" stroke-width="1.2"/>
<rect x="40" y="550" width="440" height="72" rx="8" fill="#0f1317" stroke="#3a4450" stroke-width="1.2"/>
<text x="52" y="572" fill="#c9d1d9" font-size="13" font-weight="600">6. rover health (telemetry 1 Hz)</text>
<text x="52" y="588" fill="#7f8b98" font-size="11">SOC, battery temp, actuator currents, slip, VO, tilt,</text>
<text x="52" y="601" fill="#7f8b98" font-size="11">suspension, dust, plus which way each is trending — in words</text>
<rect x="520" y="550" width="440" height="72" rx="8" fill="#12181f" stroke="#d9a441" stroke-width="1.5"/>
<text x="532" y="572" fill="#d9a441" font-size="12">fault class (Choice ×8) · stop drive · needs ground (Noul)</text>
<rect x="1000" y="550" width="460" height="72" rx="8" fill="#0f1317" stroke="#5aa7e6" stroke-width="1.2"/>
<text x="1012" y="574" fill="#5aa7e6" font-size="12">EVERY sample, 1 Hz</text>
<rect x="1500" y="550" width="460" height="72" rx="8" fill="#12181f" stroke="#4fd18b" stroke-width="1.5"/>
<text x="1512" y="571" fill="#4fd18b" font-size="11.5">stop &gt; 0.5 → halt now; ground &gt; 0.5 → Claude anomaly action;</text>
<text x="1512" y="584" fill="#9fd9b6" font-size="11.5">class change → cancel &amp; re-issue; console shows a card only when</text>
<text x="1512" y="597" fill="#9fd9b6" font-size="11.5">the picture changes [FR-11]</text>
